app-id: com.zoho.Notebook
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: notebook
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.secrets
rename-desktop-file: notebook.desktop
rename-icon: notebook
modules:
  - shared-modules/libsecret/libsecret.json

  - name: notebook
    buildsystem: simple
    build-commands:
      - ar -x Notebook*.deb
      - rm -f Notebook*.deb
      - tar -xf data.tar.xz
      - rm -f control.tar.gz data.tar.xz debian-binary
      - cp -r opt/* usr/* $FLATPAK_DEST
      - rm -rf opt usr
      - install notebook.sh $FLATPAK_DEST/bin/notebook
      - install -D -m 644 -t $FLATPAK_DEST/share/metainfo $FLATPAK_ID.metainfo.xml
      - desktop-file-edit --set-key=Exec --set-value="notebook %U" $FLATPAK_DEST/share/applications/notebook.desktop
    sources:
      - type: file
        url: https://downloads.zohocdn.com/notebooklinux-desktop/Notebook-3.7.5.deb
        sha256: a5aa1ff73c862b2e4092d3d612998e1b3cc1ea5e578d4c55cc9e561440c3508f
      - type: script
        dest-filename: notebook.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/Notebook/notebook "$@"
      - type: file
        path: com.zoho.Notebook.metainfo.xml
